name: MySQL Admin

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - provision
          - scale-up
          - scale-down
          - stop
          - start
          - delete
          - migrate
      run_migrations:
        description: "Run php artisan migrate --force after 'provision'"
        required: false
        default: "false"
        type: choice
        options: ["true","false"]
      maintenance_mode:
        description: "Put Laravel in maintenance mode during 'migrate'"
        required: false
        default: "true"
        type: choice
        options: ["true","false"]
      migration_mode:
        description: "Mode for data migration: drop & recreate all tables OR only add missing tables"
        required: false
        default: "no_overwrite"
        type: choice
        options:
          - no_overwrite
          - drop_recreate

concurrency:
  group: mysql-admin-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_RG: laravel-rg
  ACA_NAME: laravel-aca
  MYSQL_INFRA_DIR: infra/mysql

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    if: ${{ github.event.inputs.action == 'smoke' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check MySQL RP registration
        run: |
          set -euo pipefail
          STATE=$(az provider show -n Microsoft.DBforMySQL --query registrationState -o tsv || echo "Unknown")
          echo "Microsoft.DBforMySQL registrationState: $STATE"
          if [ "$STATE" != "Registered" ]; then
            echo "❌ Microsoft.DBforMySQL not registered. Register it and rerun."
            exit 1
          fi
      - name: Verify resources
        run: |
          set -euo pipefail
          az group show -n "$AZURE_RG" -o table
          az containerapp env list -g "$AZURE_RG" -o table || true
      - name: Show Container App
        run: |
          az containerapp show -g "$AZURE_RG" -n "$ACA_NAME" \
            --query "{name:name,ingress:configuration.ingress.fqdn,rev:properties.latestRevisionName}" -o yaml || true
      - name: List outbound IPs
        run: |
          az containerapp show -g "$AZURE_RG" -n "$ACA_NAME" \
            --query "properties.outboundIpAddresses" -o tsv || true

  provision:
    if: ${{ github.event.inputs.action == 'provision' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check MySQL RP registration
        run: |
          set -euo pipefail
          STATE=$(az provider show -n Microsoft.DBforMySQL --query registrationState -o tsv || echo "Unknown")
          if [ "$STATE" != "Registered" ]; then
            echo "❌ MySQL RP not registered."
            exit 1
          fi
      - name: Provision MySQL Flexible Server + DB + user
        env:
          MYSQL_ADMIN_PASSWORD: ${{ secrets.MYSQL_ADMIN_PASSWORD }}
          MYSQL_APP_PASSWORD:   ${{ secrets.MYSQL_APP_PASSWORD }}
          MYSQL_SERVER_NAME: fest-db
          MYSQL_DB_NAME:     laravel
          MYSQL_APP_USER:    appuser
          AZURE_RG:          ${{ env.AZURE_RG }}
        run: bash "$MYSQL_INFRA_DIR/provision-mysql.sh"

      - name: Run migrations (optional)
        if: ${{ github.event.inputs.run_migrations == 'true' }}
        run: |
          set -euo pipefail
          script -q -c "az containerapp exec --resource-group \"$AZURE_RG\" --name \"$ACA_NAME\" --command 'php artisan migrate --force'" /dev/null
          for cmd in config:clear cache:clear route:cache event:cache; do
            script -q -c "az containerapp exec --resource-group \"$AZURE_RG\" --name \"$ACA_NAME\" --command \"php artisan \$cmd\"" /dev/null
          done

  scale-up:
    if: ${{ github.event.inputs.action == 'scale-up' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: bash "$MYSQL_INFRA_DIR/scale-up.sh"

  scale-down:
    if: ${{ github.event.inputs.action == 'scale-down' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: bash "$MYSQL_INFRA_DIR/scale-down.sh"

  stop:
    if: ${{ github.event.inputs.action == 'stop' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: bash "$MYSQL_INFRA_DIR/stop-start-mysql.sh" stop

  start:
    if: ${{ github.event.inputs.action == 'start' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: bash "$MYSQL_INFRA_DIR/stop-start-mysql.sh" start

  delete:
    if: ${{ github.event.inputs.action == 'delete' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: bash "$MYSQL_INFRA_DIR/delete-mysql.sh"

  migrate:
    if: ${{ github.event.inputs.action == 'migrate' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install MySQL client + OpenSSH
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client openssh-client jq
      - name: Run database migration script
        env:
          AZURE_RG: ${{ env.AZURE_RG }}
          ACA_NAME: ${{ env.ACA_NAME }}

          # Cloudways (source)
          CW_DB_NAME:     ${{ secrets.CW_DB_NAME }}
          CW_DB_USER:     ${{ secrets.CW_DB_USER }}
          CW_DB_PASSWORD: ${{ secrets.CW_DB_PASSWORD }}
          CW_SSH_HOST:    ${{ secrets.CW_SSH_HOST }}
          CW_SSH_USER:    ${{ secrets.CW_SSH_USER }}
          CW_SSH_KEY:     ${{ secrets.CW_SSH_KEY }}

          # Azure (target)
          MYSQL_APP_PASSWORD: ${{ secrets.MYSQL_APP_PASSWORD }}

          # Toggles from workflow inputs
          MAINTENANCE_MODE: ${{ github.event.inputs.maintenance_mode }}
          MIGRATION_MODE:   ${{ github.event.inputs.migration_mode }}

        run: |
          echo "🔧 Migration mode: $MIGRATION_MODE"
          bash "$MYSQL_INFRA_DIR/migrate.sh"
